name: Export Notebooks

on:
  push:
    branches: [main]
    paths:
      - "examples/**/*.py"
      - "src/yohou/**"
  pull_request:
    paths:
      - "examples/**/*.py"
      - "src/yohou/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.10.0"

      - name: Install dependencies
        run: uv sync --group docs --extra plotting

      - name: Precache datasets
        run: timeout 120 uv run python docs/precache_datasets.py || echo "Dataset precache timed out"

      - name: Export notebooks
        run: uv run python docs_build/_notebooks.py

      - name: Package notebook cache
        run: tar czf notebook-exports.tar.gz -C docs/examples .

      - name: Upload to release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: notebook-cache
          name: Notebook HTML Cache
          body: Auto-generated cache of exported marimo notebook HTML. Downloaded by RTD builds to skip slow re-exports.
          files: notebook-exports.tar.gz
          prerelease: true
          make_latest: false
