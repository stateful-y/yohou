name: Export Notebooks

on:
  push:
    branches: [main]
    paths:
      - "examples/**/*.py"
      - "src/yohou/**"
  pull_request:
    paths:
      - "examples/**/*.py"
      - "src/yohou/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group docs --extra plotting

      - name: Precache datasets
        run: timeout 120 uv run python docs/precache_datasets.py || echo "Dataset precache timed out"

      - name: Export notebooks
        run: |
          uv run python -c "
          import sys; sys.path.insert(0, 'docs')
          from hooks import on_pre_build
          on_pre_build(None)
          "

      - name: Package notebook cache
        run: tar czf notebook-exports.tar.gz -C docs/examples .

      - name: Upload to release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: notebook-cache
          name: Notebook HTML Cache
          body: Auto-generated cache of exported marimo notebook HTML. Downloaded by RTD builds to skip slow re-exports.
          files: notebook-exports.tar.gz
          prerelease: true
          make_latest: false
