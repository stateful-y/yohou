name: Regenerate Dataset Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync

      - name: Generate dataset files
        run: uv run python scripts/generate_dataset_parquets.py dataset_parquets

      - name: Verify dataset files
        run: |
          count=$(ls dataset_parquets/*.bin 2>/dev/null | wc -l)
          echo "Generated $count dataset files"
          ls -lh dataset_parquets/*.bin
          if [ "$count" -lt 12 ]; then
            echo "::error::Expected at least 12 dataset files, got $count"
            exit 1
          fi

      - name: Push to datasets branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin datasets || true

          if git rev-parse --verify origin/datasets >/dev/null 2>&1; then
            git worktree add datasets-worktree origin/datasets
          else
            git worktree add --detach datasets-worktree
            pushd datasets-worktree
            git checkout --orphan datasets
            git rm -rf . 2>/dev/null || true
            popd
          fi

          rm -f datasets-worktree/*.parquet datasets-worktree/*.bin
          cp dataset_parquets/*.bin datasets-worktree/
          cd datasets-worktree
          git add -A

          if git diff --staged --quiet; then
            echo "No changes to dataset files"
          else
            git commit -m "Regenerate dataset files" \
              -m "Generated by: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            git push origin HEAD:datasets
          fi
