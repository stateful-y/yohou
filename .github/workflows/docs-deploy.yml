name: Deploy Docs

# Zensical needs ~8.6 GB of RAM to render yohou's docs (~460 pages / ~365 API
# symbols), which exceeds Read the Docs' ~1 GB build limit and OOM-kills
# `zensical build` there (exit 137). So the site is built HERE, where there is
# ample memory, and the rendered result is uploaded to the `docs-site` GitHub
# release. `.readthedocs.yml` then only downloads and serves it. This mirrors the
# existing notebook-cache release pattern (see export-notebooks.yml).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Every run publishes the same `docs-site.tar.gz` asset onto the same `docs-site`
# release, so two runs in flight at once race: each deletes the previously uploaded
# asset before uploading its own, and whichever loses fails with no error text at all
# -- the log simply stops after "Deleting previously uploaded asset".
#
# That went unnoticed while merges to main were human-paced and minutes apart. The
# automerge queue changed the arrival rate, not the workflow: on 2026-08-13 three
# dependency merges landed within 29 seconds, three ~10-minute builds overlapped, and
# all three failed. The docs were never actually broken.
#
# Serialise instead of retrying. Only the newest site is worth publishing, so an
# in-flight build for a superseded commit is wasted work: cancelling it frees the
# runner and the survivor publishes the newer content anyway.
concurrency:
  group: docs-deploy
  cancel-in-progress: true

# Least-privilege default: read-only token; the build job widens to contents:write
# for the release upload.
permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # Required to publish the rendered site to the `docs-site` release.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.12.7"

      - name: Build the documentation site (Zensical)
        env:
          # Must equal `site_dir` in mkdocs.yml, which is what actually decides
          # where `zensical build` writes -- Zensical has no site-dir flag. This
          # workflow is repo-local (the template does not own it), so nothing
          # updates it automatically when that key moves; a mismatch shows up as
          # the `tar` step below failing, not as a silent empty publish.
          SITE_DIR: .artifacts/site
        run: |
          uv sync --group docs --extra plotting
          timeout 120 uv run python docs/precache_datasets.py || echo "Dataset precache timed out; notebooks will download on demand"
          mkdir -p docs/examples
          curl -sfL https://github.com/stateful-y/yohou/releases/download/notebook-cache/notebook-exports.tar.gz | tar xz -C docs/examples || echo "No notebook cache; exporting from scratch"
          uv run python docs_build/build.py prebuild
          uv run zensical build
          uv run python docs_build/build.py postbuild "$SITE_DIR"
          uvx linkchecker "$SITE_DIR/index.html" --no-status --no-warnings || echo "linkcheck reported issues (non-fatal)"

      - name: Package rendered site
        env:
          SITE_DIR: .artifacts/site
        run: tar czf docs-site.tar.gz -C "$SITE_DIR" .

      - name: Publish the rendered site to the docs-site release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: docs-site
          name: Rendered Documentation Site
          body: Auto-generated rendered docs site, downloaded and served by Read the Docs. Built here because `zensical build` OOMs RTD's builder.
          files: docs-site.tar.gz
          prerelease: true
          make_latest: false

      - name: Trigger a Read the Docs build to publish the fresh site
        env:
          RTD_TOKEN: ${{ secrets.RTD_TOKEN }}
        run: |
          if [ -n "$RTD_TOKEN" ]; then
            curl -sf -X POST -H "Authorization: Token $RTD_TOKEN" \
              https://readthedocs.org/api/v3/projects/yohou/versions/latest/builds/ \
              && echo "Triggered Read the Docs build" || echo "RTD trigger call failed (check the token / project slug)"
          else
            echo "RTD_TOKEN secret not set -- RTD will publish this site on its next build. Add the secret for immediate publish."
          fi
