      - Custom Estimators: pages/api/custom-estimators.md
    - Extensions: pages/reference/extensions.md
    - Changelog: pages/reference/changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/stateful-y/yohou

watch:
  - mkdocs.yml
  - docs
  - examples
