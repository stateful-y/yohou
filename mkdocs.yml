site_name: Yohou
site_description: A time series forecasting package based on Scikit-Learn and Polars
site_url: https://yohou.readthedocs.io/
repo_url: https://github.com/stateful-y/yohou
repo_name: stateful-y/yohou
edit_uri: edit/main/docs/

hooks:
  - docs/hooks.py

theme:
  name: material
  custom_dir: docs/material/overrides
  favicon: assets/favicon.png
  logo: assets/logo.png

  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.prune
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.integrate

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - sane_lists
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - class: mermaid
          name: mermaid
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.emoji

extra_css:
  - stylesheets/theme.css
  - https://cdn.datatables.net/2.2.2/css/dataTables.dataTables.min.css
  - stylesheets/gallery.css

extra_javascript:
  - javascripts/readthedocs.js
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://code.jquery.com/jquery-3.7.1.min.js
  - https://cdn.datatables.net/2.2.2/js/dataTables.min.js

exclude_docs: |
  api-submodule.html
  examples/**/CLAUDE.md

# Generated API pages are injected into nav dynamically by hooks.py
not_in_nav: |
  assets/README.md
  pages/api/*.md
  pages/api/generated/*.md

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: ignore  # Ignore absolute links - we handle them in hooks
    unrecognized_links: ignore  # Ignore unrecognized links - examples HTML is generated

plugins:
  - search
  - tags
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://scikit-learn.org/stable/objects.inv
            - https://docs.pola.rs/api/python/stable/objects.inv
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            signature_crossrefs: true
            scoped_crossrefs: true
            relative_crossrefs: true

nav:
  - Home: index.md
  - Getting Started:
    - pages/getting-started/index.md
    - Installation: pages/getting-started/installation.md
    - Overview: pages/getting-started/overview.md
  - User Guide:
    - pages/user-guide/index.md
    - Core Concepts: pages/user-guide/core-concepts.md
    - Forecasting: pages/user-guide/forecasting.md
    - Interval Forecasting: pages/user-guide/interval-forecasting.md
    - Preprocessing: pages/user-guide/preprocessing.md
    - Stationarity: pages/user-guide/stationarity.md
    - Model Selection: pages/user-guide/model-selection.md
    - Visualization: pages/user-guide/visualization.md
    - Advanced Topics: pages/user-guide/advanced.md
  - API Reference:
    - pages/api/index.md
    - yohou.base: pages/api/base.md
    - yohou.compose: pages/api/compose.md
    - yohou.point: pages/api/point.md
    - yohou.interval: pages/api/interval.md
    - yohou.metrics: pages/api/metrics.md
    - yohou.model_selection: pages/api/model-selection.md
    - yohou.preprocessing: pages/api/preprocessing.md
    - yohou.stationarity: pages/api/stationarity.md
    - yohou.plotting: pages/api/plotting.md
    - yohou.datasets: pages/api/datasets.md
    - yohou.utils: pages/api/utils.md
    - yohou.testing: pages/api/testing.md
  - Examples:
    - pages/examples/index.md
    - Quickstart: pages/examples/quickstart.md
    - Point Forecasting: pages/examples/point.md
    - Interval Forecasting: pages/examples/interval.md
    - Composition: pages/examples/compose.md
    - Preprocessing: pages/examples/preprocessing.md
    - Stationarity: pages/examples/stationarity.md
    - Metrics: pages/examples/metrics.md
    - Model Selection: pages/examples/model-selection.md
    - Datasets: pages/examples/datasets.md
    - Plotting: pages/examples/plotting.md
  - Development:
    - pages/development/index.md
    - Contributing: pages/development/contributing.md
    - Developing Estimators: pages/development/developing-estimators.md
    - Changelog: pages/development/changelog.md
  - Extensions: pages/extensions/index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/stateful-y/yohou

watch:
  - mkdocs.yml
  - docs
  - examples
