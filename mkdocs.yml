    - Installation: pages/how-to/installation.md
    - Choose a Forecasting Method: pages/how-to/choose-forecasting-method.md
    - Evaluate Forecast Accuracy: pages/how-to/evaluate-forecast-accuracy.md
    - Evaluate with Multi-vintage Scoring: pages/how-to/multi-vintage-scoring.md
    - Visualize and Compare Model Scores: pages/how-to/visualize-scores.md
    - Work with Panel Data: pages/how-to/panel-data.md
    - Use Time Weighting: pages/how-to/time-weighting.md
    - Combine Forecasters with Ensembles: pages/how-to/ensemble-forecasting.md
    - Forecast Categorical Time Series: pages/how-to/classification-forecasting.md
    - Add Calendar and Time Features: pages/how-to/time-features.md
    - Use Exogenous Features: pages/how-to/exogenous-features.md
    - Create Custom Estimators: pages/how-to/custom-estimators.md
    - Create Custom Scorers: pages/how-to/creating-a-scorer.md
    - Troubleshooting: pages/how-to/troubleshooting.md
    - Contributing: pages/how-to/contribute.md
  - Examples:
