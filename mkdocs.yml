    - Quickstart: pages/examples/quickstart.md
    - Point Forecasting: pages/examples/point.md
    - Interval Forecasting: pages/examples/interval.md
    - Class-Probability Forecasting: pages/examples/class_proba.md
    - Ensemble: pages/examples/ensemble.md
    - Composition: pages/examples/compose.md
    - Preprocessing: pages/examples/preprocessing.md
    - Stationarity: pages/examples/stationarity.md
    - Metrics: pages/examples/metrics.md
    - Model Selection: pages/examples/model-selection.md
    - Datasets: pages/examples/datasets.md
    - Plotting: pages/examples/plotting.md
  - Explanation:
    - Core Concepts: pages/explanation/core-concepts.md
    - Time Series Patterns: pages/explanation/time-series-patterns.md
    - Forecasting: pages/explanation/forecasting.md
    - Interval Forecasting: pages/explanation/interval-forecasting.md
    - Class-Probability Forecasting: pages/explanation/class-probability-forecasting.md
    - Ensemble Forecasting: pages/explanation/ensemble-forecasting.md
    - Composition and Pipelines: pages/explanation/composition.md
    - Exogenous Features: pages/explanation/exogenous-features.md
    - Preprocessing: pages/explanation/preprocessing.md
    - Stationarity: pages/explanation/stationarity.md
    - Model Selection: pages/explanation/model-selection.md
    - Forecast Accuracy: pages/explanation/forecast-accuracy.md
    - Weighting: pages/explanation/weighting.md
    - Residual Diagnostics: pages/explanation/residual-diagnostics.md
    - Practical Issues: pages/explanation/practical-issues.md
    - Visualization: pages/explanation/visualization.md
    - Advanced Topics: pages/explanation/advanced.md
    - Extending Yohou: pages/explanation/extending-yohou.md
