# Read the Docs configuration
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    pre_create_environment:
      # Install uv via asdf (or system package) before creating the venv
      - asdf plugin add uv || true
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      # Create the virtual environment using uv
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      # Sync doc-dependencies (the group "docs") and install the project itself
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --group docs --extra plotting
    post_install:
      # Pre-download all datasets so marimo HTML exports read from parquet cache
      # instead of downloading and parsing large TSF archives during the build.
      # Use timeout to avoid build cancellation if Zenodo is slow.
      - timeout 120 bash -c 'UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv run python docs/precache_datasets.py' || echo "[rtd] Dataset precache timed out or failed; notebooks will download on demand"
    pre_build:
      # Restore pre-built notebook HTML from GitHub Release cache.
      # The hooks.py content-hash check will skip notebooks that match the
      # cached version and only re-export notebooks that changed on this branch.
      - mkdir -p docs/examples
      - curl -sfL https://github.com/stateful-y/yohou/releases/download/notebook-cache/notebook-exports.tar.gz | tar xz -C docs/examples || echo "[rtd] No notebook cache found, will export all from scratch"
    post_build:
      # Check for broken links
      - uvx linkchecker "${READTHEDOCS_OUTPUT}html/index.html" --no-status --no-warnings --ignore-url material/overrides

# MkDocs configuration
mkdocs:
  configuration: mkdocs.yml
