# Read the Docs configuration
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    pre_create_environment:
      # Install uv via asdf (or system package) before creating the venv
      - asdf plugin add uv || true
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      # Create the virtual environment using uv
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      # Sync doc-dependencies (the group "docs") and install the project itself.
      # The editable install is what puts the repo root on sys.path (via the
      # wheel's `dev-mode-dirs`), so the build can load the `docs_build` markdown
      # extensions by module name at config time. `--extra plotting` installs the
      # plotting deps the example notebooks execute against during the build.
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --group docs --extra plotting
    post_install:
      # Pre-download all datasets so marimo HTML exports read from parquet cache
      # instead of downloading and parsing large TSF archives during the build.
      # Use timeout to avoid build cancellation if Zenodo is slow.
      - timeout 120 bash -c 'UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv run python docs/precache_datasets.py' || echo "[rtd] Dataset precache timed out or failed; notebooks will download on demand"
    pre_build:
      # Restore pre-built notebook HTML from GitHub Release cache first, so the
      # notebook export in `docs_build/build.py prebuild` (below) content-hashes
      # each notebook and skips those matching the cached version, re-exporting
      # only notebooks that changed on this branch.
      - mkdir -p docs/examples
      - curl -sfL https://github.com/stateful-y/yohou/releases/download/notebook-cache/notebook-exports.tar.gz | tar xz -C docs/examples || echo "[rtd] No notebook cache found, will export all from scratch"
      # Generate the API pages and export the notebooks before mkdocs builds --
      # the explicit step that replaced the deleted on_pre_build hook, which the
      # mkdocs integration no longer triggers.
      #
      # The value is an UNQUOTED (plain) scalar on purpose: a YAML list item that
      # STARTS with a quote is a quoted scalar and may carry no trailing content,
      # so `- "${VENV}/bin/python" docs_build/build.py prebuild` is a parse error
      # (check-yaml and Read the Docs both reject it). The variable needs no
      # quoting -- RTD's paths contain no spaces -- exactly like the `install:`
      # line above.
      - ${READTHEDOCS_VIRTUALENV_PATH}/bin/python docs_build/build.py prebuild
    post_build:
      # Export the cleaned markdown into the built site for LLM consumption --
      # the explicit step that replaced the deleted on_post_build hook.
      - ${READTHEDOCS_VIRTUALENV_PATH}/bin/python docs_build/build.py postbuild "${READTHEDOCS_OUTPUT}html"
      # Check for broken links
      - uvx linkchecker "${READTHEDOCS_OUTPUT}html/index.html" --no-status --no-warnings --ignore-url material/overrides

# MkDocs configuration
mkdocs:
  configuration: mkdocs.yml
