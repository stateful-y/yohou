# Read the Docs configuration
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  # Zensical needs ~8.6 GB of RAM to render this project's docs, which exceeds
  # Read the Docs' ~1 GB build memory and OOM-kills `zensical build` here
  # (exit 137, "killed due to timeout or excessive memory"). MkDocs fit; Zensical
  # does not. So the site is built in CI (.github/workflows/docs-deploy.yml, which
  # has ample RAM) and uploaded to the `docs-site` GitHub release; this build only
  # downloads and serves it, using almost no memory.
  #
  # The `docs-site` release is first created by a main-branch run of docs-deploy;
  # until it exists this download fails and the build is red -- deliberately, so a
  # missing site is loud rather than served empty. After merge, docs-deploy runs,
  # creates the release, and (with the RTD_TOKEN secret set) triggers this build.
  commands:
    - mkdir -p $READTHEDOCS_OUTPUT/html
    - curl -sfL https://github.com/stateful-y/yohou/releases/download/docs-site/docs-site.tar.gz | tar xz -C $READTHEDOCS_OUTPUT/html
